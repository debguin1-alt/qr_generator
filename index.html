<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QR Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0a0a0f;
  --surface:#12121a;
  --surface2:#1a1a26;
  --accent:#00f5a0;
  --accent2:#00d9f5;
  --text:#e8e8f0;
  --muted:#6b6b8a;
  --border:#2a2a3f;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Syne',sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:48px 16px;
}
.wrapper{width:100%;max-width:560px;}
header{text-align:center;margin-bottom:30px;}
header h1{
  font-weight:800;
  line-height:1.05;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.line1{display:block;font-size:3rem;}
.line2{display:block;font-size:2rem;}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  margin-bottom:20px;
}
input[type="text"]{
  width:100%;
  padding:16px 18px;
  border-radius:14px;
  background:#0a0a0f !important;
  color:#e8e8f0 !important;
  border:1px solid #2a2a3f !important;
  font-family:'Space Mono', monospace;
  font-size:14px;
  outline:none;
  -webkit-appearance: none;
  appearance: none;
}
input:-webkit-autofill,
input:-webkit-autofill:focus{
  -webkit-box-shadow: 0 0 0 1000px #0a0a0f inset !important;
  -webkit-text-fill-color: #e8e8f0 !important;
}
input::placeholder{
  color:#6b6b8a !important;
  opacity:1;
}
button{
  border:none;
  border-radius:12px;
  padding:14px;
  font-weight:700;
  cursor:pointer;
}
.btn-main{
  width:100%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  margin-top:10px;
}
.qr-output{display:none;text-align:center;margin-top:20px;}
.qr-output.visible{display:block;}
#qrcode{background:#fff;padding:10px;border-radius:10px;}
.row{display:flex;gap:10px;margin-top:10px;}
.btn-small{
  flex:1;
  background:var(--surface2);
  color:var(--text);
}
.history-item{
  display:flex;
  justify-content:space-between;
  background:var(--surface2);
  padding:10px;
  border-radius:10px;
  margin-top:8px;
  font-size:12px;
}
</style>
</head>
<body>
<div class="wrapper">
<header>
<h1>
<span class="line1">QR</span>
<span class="line2">Generator</span>
</h1>
</header>
<div class="card">
<input id="qrInput" placeholder="Enter text or URL">
<button class="btn-main" onclick="generateQR()">Generate</button> 
<div class="qr-output" id="qrOutput">
<div id="qrcode"></div>
<div class="row">
<button class="btn-small" onclick="downloadQR('png')">PNG</button>
<button class="btn-small" onclick="downloadQR('jpg')">JPG</button>
<button class="btn-small" onclick="shareQR()">Share</button>
</div></div></div>
<div class="card">
<div style="display:flex;justify-content:space-between;">
<b>History</b>
<button onclick="clearHistory()" style="background:none;color:#ff8080;">Clear</button>
</div>
<div id="historyList"></div>
</div></div>
<script>
let historyData = JSON.parse(localStorage.getItem('qrHistory') || '[]');
function generateQR(text){
  let input = text || document.getElementById('qrInput').value.trim();
  if(!input) return;
  document.getElementById('qrcode').innerHTML='';
  new QRCode(document.getElementById('qrcode'), {
    text: input,
    width: 240,
    height: 240
  });
  document.getElementById('qrOutput').classList.add('visible');
  saveHistory(input);
}
function saveHistory(text){
  historyData.unshift(text);
  historyData = historyData.slice(0,20);
  localStorage.setItem('qrHistory', JSON.stringify(historyData));
  renderHistory();
}
function renderHistory(){
  let list = document.getElementById('historyList');
  list.innerHTML='';
  historyData.forEach((t,i)=>{
    let div=document.createElement('div');
    div.className='history-item';
    let txt=document.createElement('span');
    txt.textContent=t;
    txt.onclick=()=>generateQR(t);
    let del=document.createElement('span');
    del.textContent='✕';
    del.style.cursor='pointer';
    del.onclick=()=>{
      historyData.splice(i,1);
      localStorage.setItem('qrHistory', JSON.stringify(historyData));
      renderHistory();
    };
    div.appendChild(txt);
    div.appendChild(del);
    list.appendChild(div);
  });
}
function clearHistory(){
  historyData=[];
  localStorage.removeItem('qrHistory');
  renderHistory();
}
function downloadQR(type){
  let canvas=document.querySelector('#qrcode canvas');
  if(!canvas) return;
  let link=document.createElement('a');
  if(type==='png'){
    link.href=canvas.toDataURL();
    link.download='qr.png';
  }else{
    let c=document.createElement('canvas');
    c.width=canvas.width;
    c.height=canvas.height;
    let ctx=c.getContext('2d');
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(canvas,0,0);
    link.href=c.toDataURL('image/jpeg');
    link.download='qr.jpg';
  }

  link.click();
}
async function shareQR(){
  let canvas=document.querySelector('#qrcode canvas');
  if(!canvas) return alert('Generate QR first');

  canvas.toBlob(async (blob)=>{
    let file=new File([blob],'qr.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'QR Code'});
    }else{
      alert('Sharing not supported');
    }  });}
renderHistory();
</script>
</body>
</html>
