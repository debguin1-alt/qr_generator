<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>QR Studio</title>
<link rel="manifest" href="manifest.json"/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#060612;
  --surface:rgba(255,255,255,0.04);
  --surface-hover:rgba(255,255,255,0.07);
  --glass:rgba(255,255,255,0.06);
  --glass-border:rgba(255,255,255,0.10);
  --accent:#a78bfa;
  --accent2:#818cf8;
  --accent3:#c084fc;
  --text:#f0f0fa;
  --text-muted:#8888aa;
  --danger:#f87171;
  --success:#4ade80;
  --border:rgba(255,255,255,0.08);
  --radius:18px;
  --radius-sm:12px;
}

html{scroll-behavior:smooth;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Bricolage Grotesque',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:48px 16px 80px;
  overflow-x:hidden;
}

/* ── Ambient Background ── */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 20% -10%, rgba(167,139,250,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 85% 15%, rgba(129,140,248,0.12) 0%, transparent 55%),
    radial-gradient(ellipse 50% 40% at 50% 90%, rgba(192,132,252,0.10) 0%, transparent 60%);
  pointer-events:none;
  z-index:0;
}

body::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(167,139,250,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(167,139,250,0.03) 1px, transparent 1px);
  background-size:40px 40px;
  pointer-events:none;
  z-index:0;
}

.wrapper{
  width:100%;
  max-width:520px;
  position:relative;
  z-index:1;
}

/* ── Header ── */
header{
  text-align:center;
  margin-bottom:36px;
  animation:fadeUp 0.6s ease both;
}
.logo-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:rgba(167,139,250,0.12);
  border:1px solid rgba(167,139,250,0.25);
  border-radius:999px;
  padding:6px 14px;
  font-size:12px;
  font-weight:500;
  color:var(--accent);
  letter-spacing:0.04em;
  text-transform:uppercase;
  margin-bottom:16px;
}
.logo-dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--accent);
  animation:pulse 2s ease infinite;
}
header h1{
  font-size:clamp(2.6rem,8vw,3.8rem);
  font-weight:800;
  line-height:1;
  letter-spacing:-0.03em;
  background:linear-gradient(135deg, #e0d5ff 0%, var(--accent) 40%, var(--accent2) 70%, #c084fc 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
header p{
  color:var(--text-muted);
  font-size:15px;
  margin-top:8px;
  font-weight:300;
}

/* ── Cards ── */
.card{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:var(--radius);
  padding:22px;
  margin-bottom:16px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  animation:fadeUp 0.6s ease both;
}
.card:nth-child(2){animation-delay:0.08s;}
.card:nth-child(3){animation-delay:0.16s;}
.card:nth-child(4){animation-delay:0.24s;}

.card-label{
  font-size:11px;
  font-weight:500;
  letter-spacing:0.08em;
  text-transform:uppercase;
  color:var(--text-muted);
  margin-bottom:14px;
}

/* ── Type Tabs ── */
.type-tabs{
  display:flex;
  gap:6px;
  background:rgba(0,0,0,0.25);
  border-radius:var(--radius-sm);
  padding:4px;
  margin-bottom:18px;
  overflow-x:auto;
  scrollbar-width:none;
}
.type-tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  flex:1;
  min-width:fit-content;
  padding:8px 12px;
  border:none;
  border-radius:9px;
  background:transparent;
  color:var(--text-muted);
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  transition:all 0.2s ease;
  white-space:nowrap;
}
.tab-btn.active{
  background:rgba(167,139,250,0.18);
  color:var(--accent);
  border:1px solid rgba(167,139,250,0.3);
}
.tab-btn:hover:not(.active){
  background:rgba(255,255,255,0.05);
  color:var(--text);
}

/* ── Form Fields ── */
.field-group{display:flex;flex-direction:column;gap:10px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{
  font-size:12px;
  font-weight:500;
  color:var(--text-muted);
  letter-spacing:0.04em;
}

input[type="text"],
input[type="email"],
input[type="tel"],
input[type="password"],
select,textarea{
  width:100%;
  padding:13px 16px;
  border-radius:12px;
  background:rgba(0,0,0,0.3);
  color:var(--text);
  border:1px solid var(--border);
  font-family:'JetBrains Mono',monospace;
  font-size:13px;
  outline:none;
  transition:border-color 0.2s ease, box-shadow 0.2s ease;
  -webkit-appearance:none;
  appearance:none;
  resize:none;
}
input[type="text"]:focus,
input[type="email"]:focus,
input[type="tel"]:focus,
input[type="password"]:focus,
select:focus,
textarea:focus{
  border-color:rgba(167,139,250,0.5);
  box-shadow:0 0 0 3px rgba(167,139,250,0.1);
}
input:-webkit-autofill,input:-webkit-autofill:focus{
  -webkit-box-shadow:0 0 0 1000px #0a0a18 inset !important;
  -webkit-text-fill-color:var(--text) !important;
}
input::placeholder,textarea::placeholder{color:rgba(136,136,170,0.5)!important;}
select option{background:#0e0e1e;}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ── Generate Button ── */
.btn-generate{
  width:100%;
  padding:15px;
  margin-top:12px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg, var(--accent), var(--accent2));
  color:#fff;
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:all 0.2s ease;
  position:relative;
  overflow:hidden;
  letter-spacing:0.01em;
}
.btn-generate::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
  opacity:0;
  transition:opacity 0.2s;
}
.btn-generate:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 30px rgba(167,139,250,0.35);
}
.btn-generate:hover::before{opacity:1;}
.btn-generate:active{transform:translateY(0);box-shadow:none;}

/* ── Customization Row ── */
.customize-row{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:16px;
}
.custom-field{display:flex;flex-direction:column;gap:6px;}
.custom-field label{
  font-size:11px;
  font-weight:500;
  letter-spacing:0.06em;
  text-transform:uppercase;
  color:var(--text-muted);
}

input[type="color"]{
  width:100%;
  height:42px;
  border:1px solid var(--border);
  border-radius:10px;
  padding:4px;
  background:rgba(0,0,0,0.3);
  cursor:pointer;
  outline:none;
  transition:border-color 0.2s;
}
input[type="color"]:hover{border-color:rgba(167,139,250,0.4);}
input[type="color"]::-webkit-color-swatch-wrapper{padding:0;border-radius:6px;}
input[type="color"]::-webkit-color-swatch{border:none;border-radius:6px;}

.size-select{
  padding:11px 14px;
  font-size:13px;
}

.ec-pills{
  display:flex;
  gap:4px;
}
.ec-pill{
  flex:1;
  padding:9px 0;
  border:1px solid var(--border);
  border-radius:8px;
  background:rgba(0,0,0,0.3);
  color:var(--text-muted);
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  font-weight:500;
  cursor:pointer;
  text-align:center;
  transition:all 0.2s ease;
}
.ec-pill.active{
  background:rgba(167,139,250,0.18);
  color:var(--accent);
  border-color:rgba(167,139,250,0.35);
}
.ec-pill:hover:not(.active){
  background:rgba(255,255,255,0.05);
  color:var(--text);
}

/* ── QR Output ── */
.qr-output{
  display:none;
  flex-direction:column;
  align-items:center;
  padding-top:6px;
  animation:qrReveal 0.4s cubic-bezier(0.34,1.56,0.64,1) both;
}
.qr-output.visible{display:flex;}

@keyframes qrReveal{
  from{opacity:0;transform:scale(0.85);}
  to{opacity:1;transform:scale(1);}
}

.qr-wrap{
  background:#fff;
  border-radius:16px;
  padding:14px;
  margin:16px 0;
  position:relative;
  box-shadow:0 0 0 1px rgba(255,255,255,0.1), 0 20px 60px rgba(0,0,0,0.4);
}

.qr-corner{
  position:absolute;
  width:18px;height:18px;
  border-color:var(--accent);
  border-style:solid;
  opacity:0.7;
}
.qr-corner.tl{top:-4px;left:-4px;border-width:3px 0 0 3px;border-radius:4px 0 0 0;}
.qr-corner.tr{top:-4px;right:-4px;border-width:3px 3px 0 0;border-radius:0 4px 0 0;}
.qr-corner.bl{bottom:-4px;left:-4px;border-width:0 0 3px 3px;border-radius:0 0 0 4px;}
.qr-corner.br{bottom:-4px;right:-4px;border-width:0 3px 3px 0;border-radius:0 0 4px 0;}

.qr-meta{
  font-size:12px;
  color:var(--text-muted);
  font-family:'JetBrains Mono',monospace;
  text-align:center;
  margin-bottom:14px;
  word-break:break-all;
  max-width:260px;
  line-height:1.5;
}
.qr-meta strong{color:var(--accent);font-weight:500;}

/* ── Action Buttons ── */
.action-row{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  width:100%;
  max-width:300px;
}
.btn-action{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  padding:12px 6px;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(255,255,255,0.04);
  color:var(--text-muted);
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:11px;
  font-weight:500;
  cursor:pointer;
  transition:all 0.2s ease;
  letter-spacing:0.02em;
}
.btn-action:hover{
  background:rgba(167,139,250,0.12);
  border-color:rgba(167,139,250,0.3);
  color:var(--accent);
  transform:translateY(-2px);
}
.btn-action:active{transform:translateY(0);}
.btn-action svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}

.copy-flash{color:var(--success)!important;border-color:rgba(74,222,128,0.3)!important;background:rgba(74,222,128,0.08)!important;}

/* ── History ── */
.history-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}
.history-count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:rgba(167,139,250,0.15);
  color:var(--accent);
  width:20px;height:20px;
  border-radius:50%;
  font-size:11px;
  font-weight:700;
  margin-left:8px;
}
.btn-clear{
  background:none;
  border:none;
  color:var(--danger);
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  opacity:0.7;
  transition:opacity 0.2s;
  padding:4px 8px;
  border-radius:8px;
}
.btn-clear:hover{opacity:1;background:rgba(248,113,113,0.1);}

.history-empty{
  text-align:center;
  padding:20px;
  color:var(--text-muted);
  font-size:13px;
}

.history-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border-radius:10px;
  background:rgba(0,0,0,0.2);
  border:1px solid transparent;
  margin-bottom:6px;
  transition:all 0.2s ease;
  cursor:pointer;
}
.history-item:hover{
  background:rgba(167,139,250,0.08);
  border-color:rgba(167,139,250,0.2);
}
.history-icon{
  width:30px;height:30px;
  border-radius:8px;
  background:rgba(167,139,250,0.12);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.history-icon svg{width:14px;height:14px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.history-text{flex:1;min-width:0;}
.history-val{
  font-size:13px;
  font-family:'JetBrains Mono',monospace;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--text);
}
.history-time{font-size:11px;color:var(--text-muted);margin-top:2px;}
.history-del{
  background:none;border:none;
  color:var(--text-muted);
  cursor:pointer;
  opacity:0;
  padding:4px;
  border-radius:6px;
  font-size:14px;
  transition:all 0.15s;
  line-height:1;
}
.history-item:hover .history-del{opacity:1;}
.history-del:hover{color:var(--danger);background:rgba(248,113,113,0.1);}

/* ── Input sections ── */
.input-section{display:none;}
.input-section.active{display:block;}

/* ── Animations ── */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:0.5;transform:scale(0.8);}
}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(167,139,250,0.3);border-radius:2px;}

/* ── Toast ── */
.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(20,20,35,0.9);
  backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);
  color:var(--text);
  padding:10px 20px;
  border-radius:999px;
  font-size:13px;
  font-weight:500;
  opacity:0;
  transition:all 0.3s ease;
  z-index:100;
  white-space:nowrap;
  pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── Section divider ── */
.divider{
  width:100%;
  height:1px;
  background:var(--border);
  margin:18px 0;
}

/* ── Responsive ── */
@media(max-width:400px){
  .customize-row{grid-template-columns:1fr 1fr;}
  .action-row{grid-template-columns:repeat(4,1fr);}
}
</style>
</head>
<body>

<div class="wrapper">

  <!-- Header -->
  <header>
    <div class="logo-badge">
      <span class="logo-dot"></span>
      QR Studio
    </div>
    <h1>Encode Anything</h1>
    <p>Generate beautiful QR codes in seconds</p>
  </header>

  <!-- Main Card -->
  <div class="card">
    <div class="card-label">Content Type</div>

    <!-- Tabs -->
    <div class="type-tabs">
      <button class="tab-btn active" onclick="switchTab('url',this)">🔗 URL</button>
      <button class="tab-btn" onclick="switchTab('text',this)">📝 Text</button>
      <button class="tab-btn" onclick="switchTab('wifi',this)">📶 WiFi</button>
      <button class="tab-btn" onclick="switchTab('email',this)">✉️ Email</button>
      <button class="tab-btn" onclick="switchTab('phone',this)">📞 Phone</button>
    </div>

    <!-- URL -->
    <div class="input-section active" id="sec-url">
      <input type="text" id="in-url" placeholder="https://example.com" autocomplete="off"/>
    </div>

    <!-- Text -->
    <div class="input-section" id="sec-text">
      <textarea id="in-text" rows="3" placeholder="Any text, message or data…"></textarea>
    </div>

    <!-- WiFi -->
    <div class="input-section" id="sec-wifi">
      <div class="field-group">
        <input type="text" id="in-ssid" placeholder="Network name (SSID)"/>
        <div class="row2">
          <input type="password" id="in-wpass" placeholder="Password"/>
          <select id="in-enc">
            <option value="WPA">WPA/WPA2</option>
            <option value="WEP">WEP</option>
            <option value="">None</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Email -->
    <div class="input-section" id="sec-email">
      <div class="field-group">
        <input type="email" id="in-emailto" placeholder="recipient@example.com"/>
        <input type="text" id="in-emailsub" placeholder="Subject (optional)"/>
        <textarea id="in-emailbody" rows="2" placeholder="Message (optional)"></textarea>
      </div>
    </div>

    <!-- Phone -->
    <div class="input-section" id="sec-phone">
      <input type="tel" id="in-phone" placeholder="+1 234 567 8900"/>
    </div>

    <button class="btn-generate" onclick="generateQR()">
      Generate QR Code
    </button>
  </div>

  <!-- Customization Card -->
  <div class="card">
    <div class="card-label">Appearance & Quality</div>
    <div class="customize-row">
      <div class="custom-field">
        <label>QR Color</label>
        <input type="color" id="qrColor" value="#000000"/>
      </div>
      <div class="custom-field">
        <label>Background</label>
        <input type="color" id="qrBg" value="#ffffff"/>
      </div>
      <div class="custom-field">
        <label>Size</label>
        <select id="qrSize" class="size-select">
          <option value="160">Small</option>
          <option value="240" selected>Medium</option>
          <option value="320">Large</option>
          <option value="480">XL</option>
        </select>
      </div>
    </div>
    <div style="margin-top:14px;">
      <div class="card-label" style="margin-bottom:8px;">Error Correction</div>
      <div class="ec-pills">
        <button class="ec-pill active" data-ec="L" onclick="setEC(this)">L</button>
        <button class="ec-pill" data-ec="M" onclick="setEC(this)">M</button>
        <button class="ec-pill" data-ec="Q" onclick="setEC(this)">Q</button>
        <button class="ec-pill" data-ec="H" onclick="setEC(this)">H</button>
      </div>
    </div>
  </div>

  <!-- QR Output -->
  <div class="card" id="outputCard" style="display:none;align-items:center;text-align:center;">
    <div class="qr-output visible" id="qrOutput">
      <div class="qr-wrap" id="qrWrap">
        <span class="qr-corner tl"></span>
        <span class="qr-corner tr"></span>
        <span class="qr-corner bl"></span>
        <span class="qr-corner br"></span>
        <div id="qrcode"></div>
      </div>
      <div class="qr-meta" id="qrMeta"></div>
      <div class="action-row">
        <button class="btn-action" onclick="downloadQR('png')">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          PNG
        </button>
        <button class="btn-action" onclick="downloadQR('jpg')">
          <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          JPG
        </button>
        <button class="btn-action" id="copyBtn" onclick="copyQR()">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          Copy
        </button>
        <button class="btn-action" onclick="shareQR()">
          <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
          Share
        </button>
      </div>
    </div>
  </div>

  <!-- History Card -->
  <div class="card">
    <div class="history-header">
      <div style="display:flex;align-items:center;font-size:14px;font-weight:600;">
        History
        <span class="history-count" id="histCount">0</span>
      </div>
      <button class="btn-clear" onclick="clearHistory()">Clear all</button>
    </div>
    <div id="historyList">
      <div class="history-empty">No QR codes generated yet</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let activeTab = 'url';
let activeEC = 'L';
let historyData = JSON.parse(localStorage.getItem('qrHistory2') || '[]');

function switchTab(tab, btn){
  activeTab = tab;
  document.querySelectorAll('.input-section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-' + tab).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function setEC(btn){
  document.querySelectorAll('.ec-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeEC = btn.dataset.ec;
}

function buildContent(){
  switch(activeTab){
    case 'url': return document.getElementById('in-url').value.trim();
    case 'text': return document.getElementById('in-text').value.trim();
    case 'wifi':{
      const s=document.getElementById('in-ssid').value.trim();
      const p=document.getElementById('in-wpass').value;
      const e=document.getElementById('in-enc').value;
      if(!s) return null;
      return `WIFI:T:${e||'nopass'};S:${s};P:${p};;`;
    }
    case 'email':{
      const to=document.getElementById('in-emailto').value.trim();
      if(!to) return null;
      const sub=document.getElementById('in-emailsub').value.trim();
      const body=document.getElementById('in-emailbody').value.trim();
      let str=`mailto:${to}`;
      const ps=[];
      if(sub) ps.push('subject='+encodeURIComponent(sub));
      if(body) ps.push('body='+encodeURIComponent(body));
      if(ps.length) str+='?'+ps.join('&');
      return str;
    }
    case 'phone':{
      const p=document.getElementById('in-phone').value.trim();
      return p ? `tel:${p}` : null;
    }
  }
}

function getECLevel(){
  return {L:QRCode.CorrectLevel.L, M:QRCode.CorrectLevel.M, Q:QRCode.CorrectLevel.Q, H:QRCode.CorrectLevel.H}[activeEC];
}

function generateQR(){
  const content = buildContent();
  if(!content){ showToast('Please enter some content first'); return; }
  
  const size = parseInt(document.getElementById('qrSize').value);
  const color = document.getElementById('qrColor').value;
  const bg = document.getElementById('qrBg').value;

  const el = document.getElementById('qrcode');
  el.innerHTML = '';

  new QRCode(el, {
    text: content,
    width: size,
    height: size,
    colorDark: color,
    colorLight: bg,
    correctLevel: getECLevel()
  });

  const oc = document.getElementById('outputCard');
  oc.style.display = 'flex';
  oc.style.flexDirection = 'column';

  // Trigger re-animation
  const out = document.getElementById('qrOutput');
  out.style.animation = 'none';
  out.offsetHeight;
  out.style.animation = '';

  // Meta label
  const meta = document.getElementById('qrMeta');
  const short = content.length > 50 ? content.slice(0,47)+'…' : content;
  meta.innerHTML = `<strong>${activeTab.toUpperCase()}</strong> · ${short}`;

  saveHistory(content, activeTab);
  oc.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function saveHistory(val, type){
  const entry = {val, type, ts: Date.now()};
  historyData = historyData.filter(h => h.val !== val);
  historyData.unshift(entry);
  historyData = historyData.slice(0, 30);
  localStorage.setItem('qrHistory2', JSON.stringify(historyData));
  renderHistory();
}

function typeIcon(type){
  const icons = {
    url: `<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>`,
    text: `<svg viewBox="0 0 24 24"><line x1="21" y1="6" x2="3" y2="6"/><line x1="15" y1="12" x2="3" y2="12"/><line x1="17" y1="18" x2="3" y2="18"/></svg>`,
    wifi: `<svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0114.08 0"/><path d="M1.42 9a16 16 0 0121.16 0"/><path d="M8.53 16.11a6 6 0 016.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>`,
    email: `<svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>`,
    phone: `<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 9.81 19.79 19.79 0 01.06 1.22 2 2 0 012.06.01h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.29 6.29l.85-.85a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>`
  };
  return icons[type] || icons.url;
}

function timeAgo(ts){
  const diff = Date.now() - ts;
  if(diff < 60000) return 'just now';
  if(diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if(diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  return Math.floor(diff/86400000) + 'd ago';
}

function renderHistory(){
  const list = document.getElementById('historyList');
  document.getElementById('histCount').textContent = historyData.length;
  if(!historyData.length){
    list.innerHTML = '<div class="history-empty">No QR codes generated yet</div>';
    return;
  }
  list.innerHTML = historyData.map((h,i)=>`
    <div class="history-item" onclick="loadHistory(${i})">
      <div class="history-icon">${typeIcon(h.type||'url')}</div>
      <div class="history-text">
        <div class="history-val">${h.val||h}</div>
        <div class="history-time">${h.ts ? timeAgo(h.ts) : ''} · ${(h.type||'url').toUpperCase()}</div>
      </div>
      <button class="history-del" onclick="delHistory(event,${i})">✕</button>
    </div>
  `).join('');
}

function loadHistory(i){
  const h = historyData[i];
  const val = h.val || h;
  const type = h.type || 'url';
  switchTab(type, document.querySelector(`.tab-btn:nth-child(${['url','text','wifi','email','phone'].indexOf(type)+1})`));
  document.querySelectorAll('.tab-btn').forEach((b,j)=>{
    const tabs = ['url','text','wifi','email','phone'];
    if(tabs[j]===type){ b.classList.add('active'); } else { b.classList.remove('active'); }
  });
  activeTab = type;
  document.querySelectorAll('.input-section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-'+type).classList.add('active');
  
  if(type==='url') document.getElementById('in-url').value = val;
  else if(type==='text') document.getElementById('in-text').value = val;
  else if(type==='phone') document.getElementById('in-phone').value = val.replace('tel:','');
  
  generateQR();
}

function delHistory(e, i){
  e.stopPropagation();
  historyData.splice(i, 1);
  localStorage.setItem('qrHistory2', JSON.stringify(historyData));
  renderHistory();
}

function clearHistory(){
  if(!historyData.length) return;
  historyData = [];
  localStorage.removeItem('qrHistory2');
  renderHistory();
  showToast('History cleared');
}

function getCanvas(){
  return document.querySelector('#qrcode canvas');
}

function downloadQR(type){
  const canvas = getCanvas();
  if(!canvas){ showToast('Generate a QR code first'); return; }
  const link = document.createElement('a');
  if(type==='png'){
    link.href = canvas.toDataURL('image/png');
    link.download = 'qr-code.png';
  } else {
    const c = document.createElement('canvas');
    c.width = canvas.width; c.height = canvas.height;
    const ctx = c.getContext('2d');
    ctx.fillStyle = document.getElementById('qrBg').value;
    ctx.fillRect(0,0,c.width,c.height);
    ctx.drawImage(canvas,0,0);
    link.href = c.toDataURL('image/jpeg',0.95);
    link.download = 'qr-code.jpg';
  }
  link.click();
  showToast('Downloaded as ' + type.toUpperCase());
}

async function copyQR(){
  const canvas = getCanvas();
  if(!canvas){ showToast('Generate a QR code first'); return; }
  try{
    canvas.toBlob(async blob => {
      await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
      const btn = document.getElementById('copyBtn');
      btn.classList.add('copy-flash');
      setTimeout(()=>btn.classList.remove('copy-flash'), 1500);
      showToast('Copied to clipboard!');
    });
  } catch(e){ showToast('Copy not supported in this browser'); }
}

async function shareQR(){
  const canvas = getCanvas();
  if(!canvas){ showToast('Generate a QR code first'); return; }
  canvas.toBlob(async blob => {
    const file = new File([blob], 'qr-code.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:'QR Code'}); }
      catch(e){}
    } else {
      showToast('Sharing not supported on this device');
    }
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 2500);
}

// Enter key support
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey && e.target.tagName !== 'TEXTAREA'){
    generateQR();
  }
});

renderHistory();
</script>
